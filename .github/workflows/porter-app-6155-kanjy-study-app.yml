"on":
    push:
        branches:
            - porter-deploy
name: Deploy to kanjy-study-app
jobs:
    porter-deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Set Github tag
              id: vars
              run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
            - name: Setup porter
              uses: porter-dev/setup-porter@v0.2.0
            - name: Deploy stack
              timeout-minutes: 30
              run: porter apply
              env:
                PORTER_APP_NAME: kanjy-study-app
                PORTER_CLUSTER: "6155"
                PORTER_DEPLOYMENT_TARGET_ID: 57502987-f009-4544-b628-025d0b752bf0
                PORTER_HOST: https://dashboard.porter.run
                PORTER_PROJECT: "20184"
                PORTER_TAG: ${{ steps.vars.outputs.sha_short }}
                PORTER_TOKEN: ${{ secrets.PORTER_APP_20184_27453 }}
